name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here can write to the repository except the release job at the bottom, which only uploads files.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit tests (includes an install and uninstall round trip into a scratch folder)
        run: python -m unittest discover -s tests -v

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = '0.0.0-ci' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build and pack
        shell: pwsh
        run: |
          ./build.ps1 -Python python
          ./tools/package.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Loud-${{ steps.ver.outputs.version }}
          path: |
            release/*.zip
            release/*.zip.sha256
          if-no-files-found: error

  # Only runs for a v* tag, and only uploads what the build job produced: no checkout, no build, no scripts from the repository.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Loud-${{ needs.build.outputs.version }}
          path: release

      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" "release/Loud-$VERSION.zip" "release/Loud-$VERSION.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --title "Loud $TAG" --generate-notes --verify-tag
